[project]
name = "enterprise-knowledge-workflow"
version = "0.1.0"
description = "Enterprise knowledge retrieval and workflow assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "redis>=5,<8",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

